# ============================================================
#  Secrets and environment-specific values come from ENVIRONMENT
#  VARIABLES (or application-local.properties). Nothing secret
#  is stored in this file. See the README for how to set them.
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pg_db}
spring.datasource.username=${DB_USERNAME:postgres}
# No default on purpose: the app will not start without a password
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# DDL_AUTO: "update" keeps your data and adds new tables/columns.
# NEVER use "create" or "create-drop" - they delete all data on every restart.
# For production use "validate" together with a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# No default on purpose: must be set, at least 32 characters. Generate one with:
#   openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Optional: creates the first SUPER_ADMIN at startup (see AdminSeeder)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Super Admin}

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Rent is due on the 5th of every month. After this, penalty applies.
pg.rent.due-day=5
# Late payment penalty percentage
pg.rent.penalty-percent=5

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Photo uploads (move-in / move-out evidence). Files are stored here, outside the web root.
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Versioned schema changes (see README, "Flyway"). Off by default so a brand new database can first
# be created by Hibernate. Turn on with FLYWAY_ENABLED=true once the tables exist.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
